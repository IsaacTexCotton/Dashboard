name: Publicar demonstração estática

on:
  push:
    branches: [main]
    paths:
      - "web-demo/**"
      - ".github/workflows/publicar-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Verificar prévia auto-contida
        run: |
          test -s web-demo/index.html
          grep -q "Sem conexão com CRM" web-demo/index.html
          grep -q "dados fictícios" web-demo/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-demo

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
